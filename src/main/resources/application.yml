server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ACADEMICDRIVE_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:Lax}
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: academic-drive-backend
  session:
    servlet:
      cookie:
        name: ACADEMICDRIVE_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:Lax}
        path: /
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
  security:
    oauth2:
      client:
        registration:
          google:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
            client-name: Google
          google-drive:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/drive.file
            client-name: Google
        provider:
          google:
            issuer-uri: ${GOOGLE_ISSUER_URI:https://accounts.google.com}
app:
  frontend-origin: ${APP_FRONTEND_ORIGIN}
  csrf-cookie-domain: ${CSRF_COOKIE_DOMAIN:}
  google:
    api-base-url: ${GOOGLE_API_BASE_URL:https://www.googleapis.com}
    userinfo-url: ${GOOGLE_USERINFO_URL:https://www.googleapis.com/oauth2/v3/userinfo}
    token-revocation-url: ${GOOGLE_TOKEN_REVOCATION_URL:https://oauth2.googleapis.com/revoke}

security:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
